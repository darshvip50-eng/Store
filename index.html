<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a7a5a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="المحل"><link rel="apple-touch-icon" href="icon-180.png"><title>نظام المحل</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#111;--mut:#667;--pr:#0a7a5a;--bd:#dde;--rd:#c0392b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181c;--card:#22252b;--tx:#eee;--mut:#9aa;--pr:#2ec99a;--bd:#363a42;--rd:#ff7b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181c;--card:#22252b;--tx:#eee;--mut:#9aa;--pr:#2ec99a;--bd:#363a42;--rd:#ff7b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:70px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px}
input{width:100%;padding:11px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
button{padding:12px;border:0;border-radius:8px;background:var(--pr);color:#fff;font-size:16px;width:100%;margin:4px 0}
button.s{background:var(--bd);color:var(--tx)}button.r{background:var(--rd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mut);border-radius:0;margin:0;padding:14px 2px;font-size:14px}nav button.on{color:var(--pr);font-weight:700}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}.big{font-size:22px;font-weight:700}
.m{color:var(--mut);font-size:14px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ov{position:fixed;inset:0;background:#000d;display:none;z-index:9;padding:16px}#rd{background:#fff}
#iv{position:fixed;inset:0;background:var(--bg);display:none;z-index:10;overflow:auto;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.inv{background:#fff;color:#000;padding:16px;border-radius:8px;margin-bottom:10px}.inv table{width:100%;border-collapse:collapse;margin-top:8px}.inv td,.inv th{border-bottom:1px solid #ccc;padding:5px;text-align:right}
a{color:var(--pr);padding:4px 8px}
@media print{body>*:not(#iv){display:none!important}#iv{position:static!important;display:block!important;background:#fff!important;padding:0!important}#iv .nop{display:none!important}.inv{border-radius:0}}
</style></head><body>

<script>
let P={},L=[],E=[],cloud=null,tab='sale',cur=null,pend='',sc=null,ready=!window.claude;
const $=id=>document.getElementById(id),n=v=>Number(v)||0,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
try{const s=JSON.parse(localStorage.getItem('shop2')||'null');if(s){P=s.P||{};L=s.L||[];E=s.E||[]}else{const o=JSON.parse(localStorage.getItem('shop')||'null');if(o)for(const[c,x]of Object.entries(o.p||{}))P['p'+c]={id:'p'+c,code:c,...x}}}catch(e){}
const saveLocal=()=>{try{localStorage.setItem('shop2',JSON.stringify({P,L,E}))}catch(e){}};
async function putP(p){P[p.id]=p;if(cloud)await cloud.collection('products').doc(p.id).set(p);else saveLocal()}
async function delP(id){delete P[id];if(cloud)await cloud.collection('products').doc(id).delete();else saveLocal()}
async function addX(k,x){x.id=x.id||uid('x');if(cloud)await cloud.collection(k=='L'?'logs':'exps').doc(x.id).set(x);else{(k=='L'?L:E).push(x);saveLocal()}}
if(window.claude)(async()=>{try{const db=await claude.use('db');if(db){cloud=db;
 db.collection('products').onSnapshot(s=>{P={};s.docs.forEach(d=>P[d.id]=d.data());redraw()});
 db.collection('logs').orderBy('ts','desc').limit(2000).onSnapshot(s=>{L=s.docs.map(d=>d.data()).reverse();redraw()});
 db.collection('exps').orderBy('ts','desc').limit(600).onSnapshot(s=>{E=s.docs.map(d=>d.data()).reverse();redraw()})}}catch(e){}ready=true;draw()})();
const tabs={sale:'بيع',ret:'مرتجع',stock:'المخزن',exp:'الخوارج',rep:'التقرير'};
function navb(){$('nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}
function go(t){tab=t;cur=null;pend='';draw()}
function loadLib(ok,fail){if(window.Html5Qrcode)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s)}
function startScan(cb){loadLib(()=>{$('ov').style.display='block';sc=new Html5Qrcode('rd');
 sc.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},c=>{stopScan();cb(c)},()=>{}).catch(()=>{stopScan();alert('تعذّر فتح الكاميرا. اكتب الكود يدويًا.')})},()=>alert('تعذّر تحميل قارئ الباركود. اتأكد من الإنترنت أو اكتب الكود يدويًا.'))}
function stopScan(){$('ov').style.display='none';if(sc){const s=sc;sc=null;s.stop().catch(()=>{}).finally(()=>{try{s.clear()}catch(e){}})}}
const byCode=c=>Object.values(P).find(p=>p.code&&p.code==c);
function look(code){code=String(code).trim();if(!code)return;const p=byCode(code);
 if(p)cur=p.id;else if(tab=='stock'||confirm('المنتج غير مسجل. تضيفه؟')){tab='stock';cur='new';pend=code}else return;draw()}
function pick(){return `<div class="c"><button onclick="startScan(look)">📷 مسح الباركود بالكاميرا</button>
<input id="sq" placeholder="ابحث بالاسم أو اكتب الباركود" oninput="srch(this.value)" onkeydown="if(event.key=='Enter')look(this.value)"><div id="sr"></div></div>`}
function srch(v){v=v.trim().toLowerCase();$('sr').innerHTML=!v?'':(Object.values(P).filter(p=>p.name.toLowerCase().includes(v)||(p.code||'').includes(v)).slice(0,8).map(p=>`<div class="row" onclick="cur='${p.id}';draw()"><span>${esc(p.name)}</span><b>${p.price}</b></div>`).join('')||'<div class="m">مفيش نتائج. اضغط Enter لو ده باركود جديد.</div>')}
function sellRet(type){const p=P[cur];let h=pick();
 if(p)h+=`<div class="c"><div class="big">${esc(p.name)}</div><div class="row"><span>سعر البيع</span><b>${p.price}</b></div>
 <div class="row"><span>السعر الأساسي</span><b>${p.cost}</b></div><div class="row"><span>المتاح بالمخزن</span><b>${p.qty}</b></div>
 <input id="q" type="number" value="1" min="1"><input id="pr" type="number" value="${p.price}">
 <button class="${type=='ret'?'r':''}" onclick="doTx('${type}')">${type=='ret'?'تأكيد المرتجع':'تأكيد البيع'}</button>${type=='sale'?'<button class="s" onclick="addC()">➕ إضافة للفاتورة</button>':''}</div>`;return h+(type=='sale'?cartCard():'')}
async function doTx(type){const p=P[cur],q=n($('q').value),pr=n($('pr').value);if(q<=0)return;
 if(type=='sale'&&q>p.qty&&!confirm('الكمية أكبر من المخزن. متابعة؟'))return;
 const ts=Date.now(),inv=String(ts).slice(-7);p.qty+=type=='sale'?-q:q;await putP(p);await addX('L',{t:type,pid:p.id,name:p.name,q,pr,cost:p.cost,ts,inv});cur=null;draw();if(type=='sale'&&confirm('تطبع فاتورة؟'))showInv([{name:p.name,q,pr}],inv,ts)}
function form(){const nw=cur=='new',p=nw?{code:pend}:P[cur]||{};
 return `<div class="c"><b>${nw?'منتج جديد':'تعديل المنتج'}</b><input id="nm" placeholder="اسم المنتج" value="${esc(p.name)}">
<div style="display:flex;gap:6px"><input id="cf" placeholder="الباركود (اختياري، تقدر تضيفه بعدين)" value="${esc(p.code)}"><button class="s" style="width:70px" onclick="startScan(c=>$('cf').value=c)">📷</button></div>
<input id="co" type="number" placeholder="السعر الأساسي" value="${p.cost??''}"><input id="pe" type="number" placeholder="سعر البيع" value="${p.price??''}">
<input id="qt" type="number" placeholder="الكمية الحالية" value="${p.qty??''}">${nw?'':'<input id="ad" type="number" placeholder="+ كمية واردة (بتتضاف على الكمية)">'}
<button onclick="saveP()">حفظ</button><button class="s" onclick="cur=null;pend='';draw()">إلغاء</button>${nw?'':'<button class="r" onclick="delProd()">حذف المنتج</button>'}</div>`}
function stock(){if(cur)return form();
 return pick()+`<div class="c"><button onclick="cur='new';pend='';draw()">➕ منتج جديد (بدون باركود)</button></div><div class="c"><b>المنتجات (${Object.keys(P).length})</b>`+Object.values(P).map(x=>`<div class="row" onclick="cur='${x.id}';draw()"><span>${esc(x.name)}<br><span class="m">${esc(x.code)||'بدون باركود'}</span></span><span>${x.qty} قطعة<br><span class="m">${x.price} / ${x.cost}</span></span></div>`).join('')+`</div>`}
async function saveP(){const name=$('nm').value.trim(),code=$('cf').value.trim();if(!name){alert('اكتب اسم المنتج');return}
 const d=code&&byCode(code);if(d&&d.id!=cur&&!confirm('الباركود ده مسجل لمنتج تاني ('+d.name+'). تكمل؟'))return;
 const old=cur=='new'?{}:P[cur];await putP({id:cur=='new'?uid('p'):cur,name,code,cost:n($('co').value),price:n($('pe').value),qty:n($('qt').value)+($('ad')?n($('ad').value):0)});cur=null;pend='';draw()}
async function delProd(){if(confirm('تحذف المنتج نهائيًا؟')){await delP(cur);cur=null;draw()}}
function exp(){return `<div class="c"><input id="ea" type="number" placeholder="المبلغ"><input id="en" placeholder="البيان (إيجار، كهرباء...)"><button onclick="addE()">تسجيل خارج</button></div><div class="c">`+E.slice(-15).reverse().map(e=>`<div class="row"><span>${esc(e.note)}<br><span class="m">${new Date(e.ts).toLocaleDateString('ar-EG')}</span></span><b>${e.a}</b></div>`).join('')+`</div>`}
async function addE(){const a=n($('ea').value);if(a<=0)return;await addX('E',{a,note:$('en').value||'-',ts:Date.now()});draw()}
let C=[],per='d';
function addC(){const p=P[cur],q=n($('q').value),pr=n($('pr').value);if(q<=0)return;const ic=C.filter(x=>x.pid==p.id).reduce((m,x)=>m+x.q,0);
 if(q+ic>p.qty&&!confirm('الكمية أكبر من المخزن. متابعة؟'))return;C.push({pid:p.id,name:p.name,q,pr,cost:p.cost});cur=null;draw()}
function cartCard(){if(!C.length)return'';const t=C.reduce((m,x)=>m+x.q*x.pr,0);
 return `<div class="c"><b>الفاتورة الحالية</b>`+C.map((x,i)=>`<div class="row"><span>${esc(x.name)} ×${x.q}</span><span>${x.q*x.pr} <a onclick="C.splice(${i},1);draw()">✖</a></span></div>`).join('')+`<div class="row big"><span>الإجمالي</span><span>${t}</span></div><button onclick="checkout()">✅ إتمام البيع وطباعة الفاتورة</button><button class="s" onclick="C=[];draw()">مسح الفاتورة</button></div>`}
async function checkout(){const ts=Date.now(),inv=String(ts).slice(-7),items=C.slice();
 for(const x of items){const p=P[x.pid];if(p){p.qty-=x.q;await putP(p)}await addX('L',{t:'sale',pid:x.pid,name:x.name,q:x.q,pr:x.pr,cost:x.cost,ts,inv})}
 C=[];draw();showInv(items,inv,ts)}
const shopName=()=>{try{return localStorage.getItem('shopname')||''}catch(e){return''}};
function setName(){const v=prompt('اسم المحل (يظهر على الفاتورة)',shopName());if(v!==null)try{localStorage.setItem('shopname',v.trim())}catch(e){}}
function showInv(items,inv,ts){if(!shopName())setName();const tot=items.reduce((m,x)=>m+x.q*x.pr,0),d=new Date(ts).toLocaleString('ar-EG'),nm=shopName()||'فاتورة';
 window._t=nm+'\nفاتورة رقم '+inv+'\n'+d+'\n'+items.map(x=>x.name+' × '+x.q+' = '+x.q*x.pr).join('\n')+'\nالإجمالي: '+tot;
 $('iv').innerHTML=`<div class="inv"><h2 style="text-align:center;margin:0">${esc(nm)}</h2><div class="m" style="text-align:center">فاتورة رقم ${inv} • ${d}</div><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>`+items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.q}</td><td>${x.pr}</td><td>${x.q*x.pr}</td></tr>`).join('')+`</table><div class="big" style="margin-top:10px">الإجمالي: ${tot}</div><div class="m" style="text-align:center;margin-top:8px">شكرًا لتعاملكم معنا</div></div><div class="nop"><button onclick="try{window.print()}catch(e){alert('الطباعة مش متاحة هنا. استخدم المشاركة أو لقطة شاشة')}">🖨 طباعة</button><button class="s" onclick="shareInv()">📤 مشاركة (واتساب...)</button><button class="s" onclick="$('iv').style.display='none'">إغلاق</button></div>`;$('iv').style.display='block'}
function shareInv(){if(navigator.share)navigator.share({text:window._t}).catch(()=>{});else{try{navigator.clipboard.writeText(window._t)}catch(e){}alert('تم نسخ نص الفاتورة')}}
function prn(id){const x=L.find(y=>y.id==id);if(!x)return;showInv(x.inv?L.filter(y=>y.inv==x.inv&&y.t=='sale'):[x],x.inv||'-',x.ts)}
function rep(){const d0=new Date();d0.setHours(0,0,0,0);if(per=='w')d0.setDate(d0.getDate()-6);if(per=='m')d0.setDate(1);
 const t0=+d0,A=L.filter(x=>x.ts>=t0),X=E.filter(x=>x.ts>=t0),s=A.filter(x=>x.t=='sale'),r=A.filter(x=>x.t=='ret'),sum=(a,f)=>a.reduce((m,x)=>m+f(x),0);
 const S=sum(s,x=>x.q*x.pr),R=sum(r,x=>x.q*x.pr),XX=sum(X,x=>x.a),Pf=sum(s,x=>(x.pr-x.cost)*x.q)-sum(r,x=>(x.pr-x.cost)*x.q);
 const m={};s.forEach(x=>m[x.name]=(m[x.name]||0)+x.q);r.forEach(x=>m[x.name]=(m[x.name]||0)-x.q);const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5),lab={d:'اليوم',w:'آخر 7 أيام',m:'الشهر'};
 return `<div class="g" style="grid-template-columns:1fr 1fr 1fr;margin:10px">`+['d','w','m'].map(k=>`<button class="${per==k?'':'s'}" onclick="per='${k}';draw()">${lab[k]}</button>`).join('')+`</div>
 <div class="c"><b>${lab[per]}</b><div class="row"><span>المبيعات (${s.length})</span><b>${S}</b></div><div class="row"><span>المرتجعات (${r.length})</span><b>${R}</b></div>
 <div class="row"><span>الخوارج</span><b>${XX}</b></div><div class="row"><span>ربح المبيعات</span><b>${Pf}</b></div><div class="row big"><span>الصافي بعد الخوارج</span><span>${Pf-XX}</span></div></div>
 <div class="c"><b>الأكثر مبيعًا</b>`+(top.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<div class="m">لسه مفيش مبيعات</div>')+`</div>
 <div class="c"><b>آخر العمليات</b>`+L.slice(-12).reverse().map(x=>`<div class="row"><span>${x.t=='sale'?'بيع':'مرتجع'}: ${esc(x.name)} ×${x.q}</span><span>${x.q*x.pr}${x.t=='sale'?` <a onclick="prn('${x.id}')">🧾</a>`:''}</span></div>`).join('')+`</div>
 <div class="c"><b>نسخة احتياطية</b><button onclick="backup()">💾 تنزيل نسخة احتياطية</button><div class="m">استرجاع من ملف نسخة:</div><input type="file" accept=".json" onchange="restore(this)"><button class="s" onclick="setName()">✏️ اسم المحل للفاتورة</button></div>`}
async function backup(){const data=JSON.stringify({v:2,P:Object.values(P),L,E}),fn='backup-'+new Date().toISOString().slice(0,10)+'.json';
 try{if(cloud){const dl=await claude.use('downloads');if(dl){await dl.save({filename:fn,data});return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;a.click()}catch(e){alert('تعذّر التنزيل')}}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const b=JSON.parse(r.result);
 if(!confirm('هيتم دمج النسخة مع البيانات الحالية. تكمل؟'))return;
 for(const p of b.P||[])await putP(p);for(const x of b.L||[])if(!L.some(y=>y.id==x.id))await addX('L',x);for(const x of b.E||[])if(!E.some(y=>y.id==x.id))await addX('E',x);
 alert('تم الاسترجاع');draw()}catch(e){alert('الملف غير صالح')}};r.readAsText(f)}
const redraw=()=>{const a=document.activeElement;if(a&&a.tagName=='INPUT'&&a.type!='file')return;draw()};
function draw(){navb();$('st').textContent=!ready?'جارٍ التحميل…':cloud?'🔄 متزامن بين الأجهزة':'📴 البيانات على هذا الموبايل فقط';
 $('app').innerHTML=!ready?'':{sale:()=>sellRet('sale'),ret:()=>sellRet('ret'),stock,exp,rep}[tab]()}
draw();
</script></body></html>
